[build]
  command = "npm ci && npm run build && npm run postbuild:netlify"
  publish = "dist/shop-owner/browser"

[build.environment]
  NODE_VERSION = "22"

# Angular 19+ SSR on Netlify Edge
[[plugins]]
  package = "@netlify/angular-runtime"

# SPA / CSR fallback if the edge function misses a path.
# Angular SSR emits index.csr.html (not index.html) — postbuild copies it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.csr.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
